name: sibilant

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip packages
        if: runner.os == 'Linux'
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Run pre-commit
        env:
          REF_BEFORE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
          REF_AFTER: ${{ github.event_name == 'pull_request' && github.head_ref || github.event.after }}
        run: |
          # make sure dropped commits are fetched
          git fetch origin $REF_BEFORE:$REF_BEFORE
          # if it's a push, check since the common ancestor of the before/after (for forced pushes)
          if [[ "${{ github.event_name }}" == "push" ]]; then
            export REF_BEFORE=$(git merge-base $REF_BEFORE $REF_AFTER)
          fi
          # make sure gitlint knows which commits to lint
          export GITLINT_COMMITS=$REF_BEFORE..$REF_AFTER
          # run pre-commit
          EXIT_CODE=0
          hatch run dev:pre-commit run --from-ref $REF_BEFORE --to-ref $REF_AFTER || EXIT_CODE=$?
          hatch run dev:pre-commit run --hook-stage manual gitlint-ci || EXIT_CODE=$?
          exit $EXIT_CODE

  unit-tests:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        if: runner.os == 'Linux'
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Run tests
        run: hatch test --python=${{ matrix.python-version }} --parallel --no-cov

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Set values
        id: values
        run: echo "cov_req=80" >> $GITHUB_OUTPUT

      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip packages
        if: runner.os == 'Linux'
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Run coverage
        id: coverage
        continue-on-error: true
        env:
          REF_BEFORE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
          REF_AFTER: ${{ github.event_name == 'pull_request' && github.head_ref || github.event.after }}
        run: |
          pwd
          ls -la
          hatch run dev:pytest --cov

          COV_POST=`hatch run dev:coverage report --precision=2 | awk '$1 == "TOTAL" {print $NF+0}'`
          COV_BELOW=`echo "$COV_POST" | awk '{print ($1 < ${{ steps.values.outputs.cov_req }})}'`

          git switch -C $REF_BEFORE --track origin/$REF_BEFORE
          hatch run dev:pytest --cov

          COV_PRE=`hatch run dev:coverage report --precision=2 | awk '$1 == "TOTAL" {print $NF+0}'`
          COV_DECREASE=`echo "$COV_POST $COV_PRE" | awk '{print ($1 < $2)}'`

          echo "cov_post=$COV_POST" >> $GITHUB_OUTPUT
          echo "cov_pre=$COV_PRE" >> $GITHUB_OUTPUT
          echo "cov_below=$COV_BELOW" >> $GITHUB_OUTPUT
          echo "cov_decrease=$COV_DECREASE" >> $GITHUB_OUTPUT

      - name: Check coverage
        uses: actions/github-script@v6
        with:
          script: |
            const cov_req = ${{ steps.values.outputs.cov_req }}
            const cov_post = ${{ steps.coverage.outputs.cov_post }}
            const cov_pre = ${{ steps.coverage.outputs.cov_pre }}
            const cov_diff = cov_post - cov_pre

            cov_post >= cov_req
              ? core.notice(`Current coverage: ${cov_post}%`)
              : core.warning(`Coverage is below ${cov_req}%, current coverage ${cov_post}%`)

            cov_diff >= 0.0
              ? core.notice(`Coverage has increased from ${cov_pre}% to ${cov_post}% (+${cov_diff.toFixed(2)}%)`)
              : core.setFailed(`Coverage has decreased from ${cov_pre}% to ${cov_post}% (${cov_diff.toFixed(2)}%)`)

